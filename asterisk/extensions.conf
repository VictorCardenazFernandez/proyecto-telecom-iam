; ============================================================
; extensions.conf — Dialplan (Plan de marcación)
; ============================================================

[default]
; Contexto de caída: rechazar llamadas no autenticadas
exten => _X.,1,Hangup(21)

[interno]
; ---- Rango de extensiones de agentes: 1001-1099 ----
exten => _10XX,1,NoOp(Llamada entrante: ${CALLERID(num)} -> ${EXTEN})
 ; Grabar la llamada cuando el canal es contestado (opción 'b' = bridge)
 ; Archivo: /var/spool/asterisk/recording/YYYYMMDD-HHMMSS-ORIGEN-DESTINO.wav
 ; El formato WAV permite reproducción directa en el navegador (FileBrowser)
 same => n,MixMonitor(/var/spool/asterisk/recording/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${EXTEN}.wav,b)
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?no_disponible)
 same => n,Hangup()
 same => n(ocupado),Playback(busy)
 same => n,Hangup()
 same => n(no_disponible),Playback(tt-allbusy)
 same => n,Hangup()

; ---- Extensión de prueba de eco ----
exten => 9999,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; ---- Extensión de conferencia básica ----
exten => 8000,1,Answer()
 same => n,ConfBridge(sala1)
 same => n,Hangup()