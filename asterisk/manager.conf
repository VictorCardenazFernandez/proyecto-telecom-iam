; ============================================================
; manager.conf — Asterisk Manager Interface (AMI)
; Permite al microservicio provisioner recargar configuración
; sin reiniciar el contenedor
; ============================================================

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0     ; Solo accesible desde la red backend-net (Docker)

; ---- Usuario del provisioner (permisos mínimos necesarios) ----
[provisioner]
secret = prov1234
deny = 0.0.0.0/0.0.0.0
permit = 172.0.0.0/8       ; Red interna Docker
read = system,call
write = system,call
