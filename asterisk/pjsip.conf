; ============================================================
; pjsip.conf — Configuración base de Asterisk (PJSIP)
;
; Reemplaza a sip.conf. La imagen andrius/asterisk:latest empaqueta
; Asterisk 22.x, versión en la que chan_sip ya fue removido del core
; (Asterisk lo eliminó a partir de la rama 21). Por eso "sip show peers"
; no existe: el canal SIP soportado ahora es exclusivamente PJSIP.
;
; Las cuentas de agentes se cargan desde pjsip_agents.conf,
; que es generado dinámicamente por el microservicio provisioner.
; ============================================================

[global]
type=global
; Identificar al usuario entrante primero por username (digest auth),
; sin permitir llamadas anónimas (equivalente a allowguest=no).
endpoint_identifier_order=username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; CRÍTICO para audio: sin esto, Asterisk anuncia su IP interna de Docker
; (ej. 172.20.0.2) en el SDP, que tu máquina no puede alcanzar — el
; registro SIP funciona igual (usa rport/aprendizaje automático), pero
; el audio (RTP) se pierde silenciosamente porque el softphone le manda
; los paquetes a una dirección inalcanzable.
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1

; ---- Incluir el archivo generado por el provisioner ----
; Este archivo contiene los endpoints/auths/aors 1001, 1002, etc. dinámicos.
; Si aún no fue generado, Asterisk arranca igual (sin extensiones).
#tryinclude "/etc/asterisk/agents/pjsip_agents.conf"