; ============================================================
; rtp.conf — Rango de puertos RTP (audio) de Asterisk
;
; CRÍTICO: este rango debe coincidir EXACTAMENTE con el rango
; publicado en docker-compose.yml ("10000-10100:10000-10100/udp").
; Sin este archivo, Asterisk usa su rango por defecto (10000-20000),
; el cual NO coincide con lo publicado en Docker, y el audio (RTP)
; nunca llega a destino aunque la señalización SIP funcione bien
; (se ve/oye el timbrado, pero no hay voz).
; ============================================================

[general]
rtpstart=10000
rtpend=10100
; Desactivado temporalmente para diagnosticar problemas de audio detrás
; del NAT de Docker Desktop (la IP de origen vista por Asterisk no es
; siempre estable a través de esa capa). Si el audio funciona con esto
; en "no", lo dejamos así de forma permanente para este entorno de lab.
strictrtp=no