; ============================================================
; sip.conf — Configuración base de Asterisk
; Las cuentas de agentes se cargan desde sip_agents.conf
; que es generado dinámicamente por el microservicio provisioner
; ============================================================

[general]
context=default
allowguest=no
bindport=5060
bindaddr=0.0.0.0
language=es
; Requerimos autenticación para todos los usuarios
alwaysauthreject=yes
; Seguridad: rechazar suscripciones vacías
allowsubscribe=no

; ---- Incluir el archivo generado por el provisioner ----
; Este archivo contiene los [1001], [1002], etc. dinámicos.
; Si aún no fue generado, Asterisk arranca igual (sin extensiones).
#tryinclude "/etc/asterisk/agents/sip_agents.conf"
