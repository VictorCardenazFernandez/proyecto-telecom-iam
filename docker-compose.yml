# ============================================================
# Infraestructura Unificada de Comunicaciones y Gestión de Identidad
# Fase 3: Integración midPoint → PostgreSQL → Asterisk
# Fase 4: Migración a PJSIP + validación de calidad y seguridad
# ============================================================

services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: telecom
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/02-load-midpoint-schema.sh:/docker-entrypoint-initdb.d/02-load-midpoint-schema.sh
      - ./db/postgres-schema.sql:/docker-entrypoint-initdb.d/sql-source/postgres-schema.sql
      - ./db/postgres-quartz.sql:/docker-entrypoint-initdb.d/sql-source/postgres-quartz.sql
      - ./db/postgres-audit.sql:/docker-entrypoint-initdb.d/sql-source/postgres-audit.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecom"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  midpoint:
    build:
      context: ./midpoint
    container_name: midpoint
    environment:
      MP_SET_midpoint_repository_jdbcUrl: "jdbc:postgresql://postgres:5432/midpoint"
      MP_SET_midpoint_repository_jdbcUsername: "telecom"
      MP_SET_midpoint_repository_jdbcPassword: "telecom123"
      MP_SET_midpoint_repository_database: "postgresql"
      MP_SET_midpoint_repository_missingSchemaAction: "create"
      JAVA_OPTS: "-Xmx2048m"
    ports:
      - "8080:8080"
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - midpoint_data:/opt/midpoint/var
      - ./midpoint/resources:/opt/midpoint/var/import:ro
    networks:
      - backend-net

  # Inicializador: crea /var/log/asterisk/cdr-csv con los permisos
  # correctos (usuario 'asterisk', no root) ANTES de que arranque
  # Asterisk. Corre una vez por cada "docker compose up" y termina.
  # Esto evita tener que hacer mkdir/chown manualmente cada vez que
  # alguien del equipo clona el repo o recrea el contenedor.
  asterisk-init:
    image: andrius/asterisk:latest
    container_name: asterisk-init
    entrypoint: ["sh", "-c", "mkdir -p /var/log/asterisk/cdr-csv && chown -R asterisk:asterisk /var/log/asterisk/cdr-csv && echo 'cdr-csv listo'"]
    volumes:
      - asterisk_logs:/var/log/asterisk
    networks:
      - backend-net

  asterisk:
    image: andrius/asterisk:latest
    container_name: asterisk
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
      - "5038:5038"           # AMI (Asterisk Manager Interface)
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf
      - asterisk_logs:/var/log/asterisk
      # sip_agents.conf es generado dinámicamente por el provisioner
      - asterisk_agents:/etc/asterisk/agents
      # Grabaciones de llamadas (MixMonitor → FileBrowser)
      - asterisk_recordings:/var/spool/asterisk/recording
    depends_on:
      midpoint:
        condition: service_started
      asterisk-init:
        condition: service_completed_successfully
    networks:
      - backend-net

  # Microservicio de aprovisionamiento: lee la BD y genera las cuentas SIP
  provisioner:
    build:
      context: ./provision
    container_name: provisioner
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: telecom
      DB_USER: telecom
      DB_PASSWORD: telecom123
      AMI_HOST: asterisk
      AMI_PORT: 5038
      AMI_USER: provisioner
      AMI_SECRET: prov1234
      POLL_INTERVAL: 30       # segundos entre chequeos de sincronización
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - asterisk_agents:/etc/asterisk/agents  # volumen compartido con Asterisk
    networks:
      - backend-net

  # ── FileBrowser: Visor y reproductor de grabaciones ─────────────────────
  # Interfaz web para explorar, descargar y reproducir las grabaciones de
  # llamadas generadas por Asterisk (MixMonitor → archivos .wav).
  # Acceso: http://localhost:8088
  # Usuario/clave inicial: admin / telecom123
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    ports:
      - "8088:80"
    volumes:
      - asterisk_recordings:/srv    # carpeta raíz del visor = grabaciones
    environment:
      FB_USERNAME: admin
      FB_PASSWORD: telecom123
    command: --noauth
    depends_on:
      - asterisk
    networks:
      - backend-net
    restart: on-failure:3

  # ── Grafana: Dashboard de Monitoreo ──────────────────────────────────────
  # Visualiza métricas del sistema en tiempo real usando PostgreSQL como
  # fuente de datos: estado de extensiones, eventos de auditoría (ISO 27001
  # A.8.16), distribución de roles y aprovisionamientos.
  # Acceso: http://localhost:3000
  # Usuario/clave inicial: admin / telecom123
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: telecom123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    restart: on-failure:3

networks:
  backend-net:
    driver: bridge

volumes:
  db_data:
  midpoint_data:
  asterisk_agents:
  asterisk_logs:
  asterisk_recordings:
  grafana_data: